<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#080205" />
<title>宁宁 · 心动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%; overflow: hidden;
    background: #080205;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    color: #f7e8e2;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; z-index: 1;
  }
  .ui {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 38px) 24px calc(env(safe-area-inset-bottom) + 40px);
    pointer-events: none;
  }
  .tag {
    font-size: 10px; letter-spacing: .42em; text-indent: .42em;
    color: rgba(255, 214, 198, .52);
    font-weight: 400;
    opacity: 0; transform: translateY(-8px);
    animation: rise 1.6s cubic-bezier(.16,.8,.28,1) .5s forwards;
  }
  .sign { text-align: center; margin-top: auto; }
  .name {
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    font-size: 40px; line-height: 1.15; letter-spacing: .16em; text-indent: .16em;
    background: linear-gradient(180deg, #fff6ef 0%, #ffd7c2 42%, #f18b92 100%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 96, 120, .45)) drop-shadow(0 0 42px rgba(210, 30, 70, .30));
    opacity: 0; transform: translateY(10px);
    animation: rise 1.8s cubic-bezier(.16,.8,.28,1) .85s forwards;
  }
  .en {
    margin-top: 14px;
    font-size: 9px; letter-spacing: .58em; text-indent: .58em;
    color: rgba(255, 206, 192, .40);
    opacity: 0; transform: translateY(10px);
    animation: rise 1.8s cubic-bezier(.16,.8,.28,1) 1.15s forwards;
  }
  .hint {
    margin-top: 18px;
    font-size: 10.5px; letter-spacing: .26em; text-indent: .26em;
    color: rgba(255, 210, 196, .34);
    transition: opacity 1.2s ease;
    opacity: 0; animation: rise 2s ease 2s forwards;
  }
  .hint.gone { opacity: 0 !important; }
  .grain {
    position: fixed; inset: 0; z-index: 3; pointer-events: none;
    opacity: .045; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.6'/></svg>");
  }
  .vignette {
    position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 100%);
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="vignette"></div>
  <div class="ui">
    <div class="tag">FOR NING NING</div>
    <div class="sign">
      <div class="name">宁 宁</div>
      <div class="en">宁 金 惠</div>
    </div>
    <div class="hint" id="hint">拖 动 旋 转 · 轻 触 心 动</div>
  </div>
  <div class="grain"></div>

<script>
(function () {
  'use strict';

  var cv = document.getElementById('stage');
  var ctx = cv.getContext('2d', { alpha: true });
  var hint = document.getElementById('hint');

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0, FIT = 300;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- 相机与光照参数 ----------
  var CAM_D = 4.4;          // 相机距离（世界单位）
  var FOV_SCALE = 0.9;      // 透视强度

  // ---------- 玫瑰金 / 绯红 色阶 ----------
  var PALETTE = [
    [255, 240, 228],   // 暖白
    [255, 216, 190],   // 香槟
    [255, 186, 158],   // 玫瑰金
    [255, 150, 136],   // 蜜桃
    [255, 104, 116],   // 珊瑚
    [236, 62, 92],     // 玫红
    [196, 30, 66],     // 正红
    [132, 10, 38]      // 深绯
  ];
  var SPRITES = [];

  function makeSprite(rgb, size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g = c.getContext('2d');
    var r = size / 2;
    var grad = g.createRadialGradient(r, r, 0, r, r, r);
    var base = 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',';
    grad.addColorStop(0, base + '0.95)');
    grad.addColorStop(0.16, base + '0.40)');
    grad.addColorStop(0.36, base + '0.13)');
    grad.addColorStop(0.68, base + '0.035)');
    grad.addColorStop(1, base + '0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, size);
    return c;
  }

  for (var s = 0; s < PALETTE.length; s++) SPRITES.push(makeSprite(PALETTE[s], 48));

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2;
    CY = H * 0.42;
    FIT = Math.min(W * 0.38, H * 0.23);
    paintBg();
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 120); });

  // ---------- 经典心形曲线 ----------
  // x = 16sin³t, y = 13cos t − 5cos2t − 2cos3t − cos4t
  function heart2D(t) {
    var s = Math.sin(t), c = Math.cos(t);
    var x = 16 * s * s * s;
    var y = 13 * c - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [x / 16, (y + 3.4) / 16];
  }

  // 按弧长均匀取点，避免凹陷处粒子堆积
  var ARC_T = [], ARC_S = [], ARC_L = 0;
  (function () {
    var M = 720, i, p, prev = heart2D(0), acc = 0, dx, dy;
    ARC_T.push(0); ARC_S.push(0);
    for (i = 1; i <= M; i++) {
      p = heart2D(i / M * 6.2832);
      dx = p[0] - prev[0]; dy = p[1] - prev[1];
      acc += Math.sqrt(dx * dx + dy * dy);
      ARC_T.push(i / M * 6.2832);
      ARC_S.push(acc);
      prev = p;
    }
    ARC_L = acc;
  })();

  function randT() {
    var s = Math.random() * ARC_L;
    var lo = 0, hi = ARC_S.length - 1, mid;
    while (lo < hi - 1) {
      mid = (lo + hi) >> 1;
      if (ARC_S[mid] <= s) lo = mid; else hi = mid;
    }
    var seg = (s - ARC_S[lo]) / ((ARC_S[hi] - ARC_S[lo]) || 1);
    return ARC_T[lo] + (ARC_T[hi] - ARC_T[lo]) * seg;
  }

  function clampIdx(v) {
    v = Math.round(v);
    return v < 0 ? 0 : (v > 7 ? 7 : v);
  }

  // ---------- 点云 ----------
  var PARTS = [], DUST = [], SPARKS = [];
  var THICK = 0.36;

  function build() {
    PARTS.length = 0; DUST.length = 0; SPARKS.length = 0;
    var i, t, u, h, dep, px, py, pz, len, ci, ny;

    function addPart(x, y, z, sMin, sMax, aMin, aMax) {
      ny = Math.min(1, Math.max(0, (y + 0.86) / 1.72));
      ci = clampIdx(ny * 6.6 + (Math.random() - 0.5) * 1.5);
      len = Math.sqrt(x * x + y * y + z * z) || 1;
      PARTS.push({
        x: x, y: y, z: z,
        s: sMin + Math.random() * (sMax - sMin),
        c: ci,
        a: aMin + Math.random() * (aMax - aMin),
        ph: Math.random() * 6.2832,
        sp: 0.55 + Math.random() * 1.1,
        bx: x / len + (Math.random() - 0.5) * 0.5,
        by: y / len + (Math.random() - 0.5) * 0.5,
        bz: z / len + (Math.random() - 0.5) * 0.5
      });
    }

    // 主体：轮廓内「充气」采样，前后两片曲面撑出体积
    for (i = 0; i < 1480; i++) {
      t = randT();
      h = heart2D(t);
      u = Math.pow(Math.random(), 0.62);
      dep = (Math.random() < 0.5 ? -1 : 1) * THICK * Math.sqrt(Math.max(0, 1 - u * u));
      addPart(h[0] * u, -h[1] * u, dep, 0.030, 0.062, 0.24, 0.56);
    }

    // 轮廓带：贴边加密，让心形一眼可辨
    for (i = 0; i < 460; i++) {
      t = randT();
      h = heart2D(t);
      u = 0.93 + Math.random() * 0.07;
      dep = (Math.random() < 0.5 ? -1 : 1) * THICK * Math.sqrt(Math.max(0, 1 - u * u));
      addPart(h[0] * u, -h[1] * u, dep, 0.032, 0.07, 0.34, 0.74);
    }

    // 高光火花
    for (i = 0; i < 80; i++) {
      t = randT();
      h = heart2D(t);
      u = 0.96 + Math.random() * 0.04;
      dep = (Math.random() < 0.5 ? -1 : 1) * THICK * Math.sqrt(Math.max(0, 1 - u * u));
      px = h[0] * u; py = -h[1] * u; pz = dep;
      len = Math.sqrt(px * px + py * py + pz * pz) || 1;
      SPARKS.push({
        x: px, y: py, z: pz,
        s: 0.05 + Math.random() * 0.05,
        c: clampIdx(Math.random() * 2.4),
        a: 0.6,
        ph: Math.random() * 6.2832,
        sp: 1.6 + Math.random() * 2.2,
        bx: px / len, by: py / len, bz: pz / len
      });
    }

    // 环境浮尘：远处的微光尘埃，撑出空间纵深
    for (i = 0; i < 200; i++) {
      var uu = Math.random() * 2 - 1;
      var th = Math.random() * 6.2832;
      var sr = Math.sqrt(1 - uu * uu);
      var rad = 1.55 + Math.pow(Math.random(), 0.7) * 2.4;
      DUST.push({
        x: sr * Math.cos(th) * rad,
        y: uu * rad * 0.9,
        z: sr * Math.sin(th) * rad,
        s: 0.022 + Math.random() * 0.038,
        c: 3 + clampIdx(Math.random() * 3),
        a: 0.06 + Math.random() * 0.22,
        ph: Math.random() * 6.2832,
        sp: 0.25 + Math.random() * 0.7
      });
    }
  }

  // ---------- 交互状态 ----------
  var rotY = -0.3, tilt = 0.12;
  var velY = 0, velT = 0;
  var spin = 0.17;
  var dragging = false, lastX = 0, lastY = 0, downT = 0, moved = 0;
  var burst = 0, burstVel = 0, flash = 0;
  var rings = [];

  function trigger() {
    burst = 1;
    burstVel = 0;
    flash = 1;
    rings.push({ r: 0.15, a: 0.85, w: 1.6 });
    if (rings.length > 4) rings.shift();
    if (hint) hint.classList.add('gone');
  }
  // ---------- 输入：拖拽旋转 / 轻触心动 ----------
  function down(x, y) {
    dragging = true;
    lastX = x; lastY = y;
    downT = performance.now();
    moved = 0; velY = 0; velT = 0;
    if (hint) hint.classList.add('gone');
  }
  function move(x, y) {
    if (!dragging) return;
    var dx = x - lastX, dy = y - lastY;
    lastX = x; lastY = y;
    moved += Math.abs(dx) + Math.abs(dy);
    rotY += dx * 0.0062;
    tilt = Math.max(-0.7, Math.min(0.9, tilt + dy * 0.0042));
    velY = dx * 0.0062 * 42;
    velT = dy * 0.0042 * 42;
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    if (moved < 14 && performance.now() - downT < 520) trigger();
  }

  cv.addEventListener('touchstart', function (e) {
    if (e.touches.length > 1) return;
    e.preventDefault();
    down(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchmove', function (e) {
    if (!dragging || e.touches.length > 1) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: false });
  cv.addEventListener('touchend', function (e) { e.preventDefault(); up(); }, { passive: false });
  cv.addEventListener('touchcancel', function () { up(); }, { passive: false });
  cv.addEventListener('mousedown', function (e) { down(e.clientX, e.clientY); });
  window.addEventListener('mousemove', function (e) { if (dragging) move(e.clientX, e.clientY); });
  window.addEventListener('mouseup', up);

  // ---------- 心跳 ----------
  function beat(T) {
    var x = (T * 1.02) % 1;
    var b1 = Math.exp(-Math.pow((x - 0.06) / 0.042, 2));
    var b2 = 0.52 * Math.exp(-Math.pow((x - 0.24) / 0.062, 2));
    return b1 + b2;
  }

  // ---------- 渲染 ----------
  var T = 0, pulse = 1, cosY = 1, sinY = 0, cosT = 1, sinT = 0;

  function drawSet(list, boost) {
    var i, p, wob, xx, yy, zz, x1, z1, y1, z2, persp, sx, sy, size, dA, img, lx, ly;
    var bAmp = burst * 0.52;
    for (i = 0; i < list.length; i++) {
      p = list[i];
      wob = 1 + Math.sin(T * p.sp + p.ph) * 0.015;
      xx = p.x * pulse * wob + p.bx * bAmp;
      yy = p.y * pulse * wob + p.by * bAmp;
      zz = p.z * pulse * wob + p.bz * bAmp;

      x1 = xx * cosY + zz * sinY;
      z1 = zz * cosY - xx * sinY;
      y1 = yy * cosT - z1 * sinT;
      z2 = z1 * cosT + yy * sinT;

      persp = CAM_D / (CAM_D - z2 * FOV_SCALE);
      if (persp > 2.1) persp = 2.1;
      else if (persp < 0.5) persp = 0.5;
      lx = CX + x1 * FIT * persp;
      ly = CY + y1 * FIT * persp;
      if (lx < -50 || lx > W + 50 || ly < -50 || ly > H + 50) continue;

      size = p.s * FIT * persp;
      dA = 0.22 + 0.78 * Math.min(1, Math.max(0, (z2 + 1.5) / 3.0));
      ctx.globalAlpha = Math.min(1, p.a * dA * boost * (0.95 + flash * 0.4));
      img = SPRITES[p.c];
      ctx.drawImage(img, lx - size * 0.5, ly - size * 0.5, size, size);
    }
  }

  var lastTs = 0;

  function frame(now) {
    if (!lastTs) lastTs = now;
    var dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    T = now / 1000;

    // 自转 + 拖拽惯性
    if (!dragging) {
      rotY += (spin + velY) * dt;
      tilt += velT * dt;
      if (tilt > 0.9) { tilt = 0.9; velT = 0; }
      if (tilt < -0.7) { tilt = -0.7; velT = 0; }
      var decay = Math.pow(0.055, dt);
      velY *= decay;
      velT *= decay;
    }

    // 心跳与爆散弹簧
    var bt = beat(T);
    pulse = 1 + 0.055 * bt;
    burstVel += (-burst * 165 - burstVel * 9.5) * dt;
    burst += burstVel * dt;
    flash *= Math.pow(0.02, dt);

    cosY = Math.cos(rotY); sinY = Math.sin(rotY);
    cosT = Math.cos(tilt); sinT = Math.sin(tilt);

    // 背景：低透明度重绘形成拖影
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 0.38;
    ctx.drawImage(bgCv, 0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';

    // 中心呼吸光晕
    var glow = 0.55 + bt * 0.55 + flash * 2.2;
    var rg = ctx.createRadialGradient(CX, CY, 0, CX, CY, FIT * 2.4);
    rg.addColorStop(0, 'rgba(255, 64, 96, ' + (0.055 * glow) + ')');
    rg.addColorStop(0.45, 'rgba(230, 30, 70, ' + (0.028 * glow) + ')');
    rg.addColorStop(1, 'rgba(120, 0, 30, 0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = rg;
    ctx.fillRect(CX - FIT * 2.4, CY - FIT * 2.4, FIT * 4.8, FIT * 4.8);

    drawSet(DUST, 1.0);
    drawSet(PARTS, 1.0);
    drawSet(SPARKS, 1.15);

    // 触碰冲击环
    for (var i = rings.length - 1; i >= 0; i--) {
      var R = rings[i];
      R.r += dt * 2.4;
      R.a -= dt * 1.15;
      if (R.a <= 0) { rings.splice(i, 1); continue; }
      ctx.globalAlpha = R.a * 0.55;
      ctx.strokeStyle = 'rgba(255, 170, 160, 1)';
      ctx.lineWidth = R.w;
      ctx.beginPath();
      ctx.ellipse(CX, CY, R.r * FIT, R.r * FIT * 0.92 * Math.abs(cosT) + 8, 0, 0, 6.2832);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(frame);
  }

  var bgCv = document.createElement('canvas');
  var bgCtx = bgCv.getContext('2d');

  function paintBg() {
    bgCv.width = Math.max(1, Math.round(W * DPR));
    bgCv.height = Math.max(1, Math.round(H * DPR));
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    var rc = Math.max(W, H);
    var bg = bgCtx.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, rc * 0.82);
    bg.addColorStop(0, '#3c1121');
    bg.addColorStop(0.28, '#250a14');
    bg.addColorStop(0.62, '#110409');
    bg.addColorStop(1, '#060103');
    bgCtx.fillStyle = bg;
    bgCtx.fillRect(0, 0, W, H);

    var glow = bgCtx.createRadialGradient(W * 0.5, H * 0.47, 0, W * 0.5, H * 0.47, rc * 0.52);
    glow.addColorStop(0, 'rgba(255, 72, 100, 0.11)');
    glow.addColorStop(0.5, 'rgba(190, 24, 62, 0.05)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = glow;
    bgCtx.fillRect(0, 0, W, H);
  }

  function init() {
    resize();
    build();
    requestAnimationFrame(frame);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) lastTs = 0;
  });

  init();
})();
</script>
</body>
</html>
